name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Mac
        - Android
        - iPhone
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: PackShepherd › About PackShepherd
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System version
      placeholder: macOS 15.1 or Android 15
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: BMS model and firmware
      description: Shown at the top of the pack page
      placeholder: 1101-LN12, FW 16.6.1
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Please don't post passwords or personal data.
    validations:
      required: true
